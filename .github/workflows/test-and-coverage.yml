name: Run Tests and Code Coverage

on:
  push:
    branches: [ master ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: [lua=5.1, lua=5.2, lua=5.3, lua=5.4, lua=5.5, luajit=@v2.0, luajit=@v2.1]
    steps:
    - uses: actions/checkout@master

    - name: Install libreadline
      run: sudo apt-get install -y libreadline-dev

    - name: Cache Restore
      uses: actions/cache/restore@v5
      with:
        path: |
          lua_install
        key: ${{ matrix.lua }}-lua_install

    - name: Install Lua (${{ matrix.lua }})
      run: |
        pip install git+https://github.com/luarocks/hererocks
        hererocks -r^ --${{ matrix.lua }} lua_install
        echo lua_install/bin >> $GITHUB_PATH
        
    - name: Install depedencies
      run: |
        luarocks install tested
        luarocks install lua-cjson
        luarocks install luacov-coveralls
        
    - name: Run unit tests with coverage
      run: tested -c

    - name: Save Cache
      uses: actions/cache/save@v5
      with:
        path: |
          lua_install
        key: ${{ matrix.lua }}-lua_install

    - name: Report test coverage
      if: success()
      continue-on-error: true
      run: luacov-coveralls -e lua_install
      env:
        COVERALLS_REPO_TOKEN: ${{ github.token }}
